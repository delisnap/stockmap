<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StockMap — 산업 관계도</title>
<style>
  :root{
    --bg:#0e1116; --panel:#151a22; --panel2:#1b2130; --line:#252c3a;
    --tx:#e6edf5; --tx2:#8b97a8; --tx3:#5c6675;
    --up:#f6465d; --down:#2ebd85;
    --accent:#7dd3fc;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden}
  body{
    background:var(--bg); color:var(--tx);
    font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo",system-ui,sans-serif;
    font-size:14px; -webkit-font-smoothing:antialiased;
  }
  #app{display:flex; height:100%}

  /* ── 좌측 사이드바 ── */
  #side{
    width:244px; flex:none; background:var(--panel);
    border-right:1px solid var(--line); display:flex; flex-direction:column;
    overflow-y:auto;
  }
  #side::-webkit-scrollbar{width:8px}
  #side::-webkit-scrollbar-thumb{background:#2a3242;border-radius:4px}
  .brand{padding:16px 16px 12px; border-bottom:1px solid var(--line)}
  .brand h1{margin:0; font-size:15px; letter-spacing:-.2px}
  .brand p{margin:3px 0 0; font-size:11px; color:var(--tx3)}
  .sec{padding:14px 16px; border-bottom:1px solid var(--line)}
  .sec h2{margin:0 0 9px; font-size:10.5px; font-weight:600; letter-spacing:.9px;
    color:var(--tx3); text-transform:uppercase; display:flex; justify-content:space-between}
  #q{
    width:100%; padding:8px 10px; border-radius:7px; border:1px solid var(--line);
    background:var(--panel2); color:var(--tx); font-size:13px; outline:none;
  }
  #q:focus{border-color:var(--accent)}
  .chk{display:flex; align-items:center; gap:8px; padding:4px 0; cursor:pointer;
    font-size:12.5px; color:var(--tx2); user-select:none}
  .chk:hover{color:var(--tx)}
  .chk .del{margin-left:auto; color:var(--tx3); font-size:13px; opacity:0; padding:0 2px}
  .chk:hover .del{opacity:1}
  .chk .del:hover{color:var(--up)}
  .cnt{margin-left:auto; font-size:10.5px; color:var(--tx3); font-variant-numeric:tabular-nums}
  .chk .del + .cnt, .chk .cnt + .del{margin-left:6px}
  .dot{width:9px;height:9px;border-radius:50%;flex:none;opacity:.25;transition:.15s}
  .chk.on .dot{opacity:1; box-shadow:0 0 8px currentColor}
  .chk.on{color:var(--tx)}
  .bar{width:16px;height:2px;flex:none;border-radius:2px;opacity:.3;transition:.15s}
  .chk.on .bar{opacity:1}
  .btn{
    display:block; width:100%; margin-top:8px; padding:8px; border-radius:7px;
    border:1px dashed var(--line); background:transparent; color:var(--tx2);
    font-size:12px; cursor:pointer; font-family:inherit;
  }
  .btn:hover{color:var(--tx); border-color:var(--tx3); background:var(--panel2)}
  .btn.solid{border-style:solid}
  .btn.pri{background:var(--accent); color:#0b1017; border-color:var(--accent); font-weight:600}
  .btn.pri:hover{filter:brightness(1.1); color:#0b1017}
  .btn.mini{width:auto; display:inline-block; margin:0; padding:5px 10px; font-size:11.5px}
  #side .foot{margin-top:auto; padding:12px 16px; font-size:10.5px;
    color:var(--tx3); line-height:1.6; border-top:1px solid var(--line)}

  /* ── 그래프 ── */
  #graphwrap{flex:1; position:relative; min-width:0}
  svg{width:100%;height:100%;display:block;cursor:grab}
  svg.drag{cursor:grabbing}
  .link{stroke-width:1.4; opacity:.28; transition:opacity .18s, stroke-width .18s}
  .link.hot{opacity:.95; stroke-width:2.4}
  .link.dim{opacity:.05}
  .node{cursor:pointer}
  .node circle{transition:.18s}
  .node text{font-size:11.5px; fill:var(--tx2); text-anchor:middle;
    pointer-events:none; transition:.18s; paint-order:stroke;
    stroke:var(--bg); stroke-width:3px}
  .node.hot text{fill:var(--tx); font-weight:600}
  .node.dim{opacity:.15}
  .node .chg{font-size:10px; font-weight:600}
  .hint{position:absolute;left:14px;bottom:12px;font-size:11px;color:var(--tx3);
    pointer-events:none}
  #zoombox{position:absolute;right:14px;bottom:12px;display:flex;gap:6px}
  #zoombox button{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);
    background:var(--panel);color:var(--tx2);cursor:pointer;font-size:14px;line-height:1}
  #zoombox button:hover{color:var(--tx);border-color:var(--tx3)}

  /* ── 우측 상세 ── */
  #detail{
    width:340px; flex:none; background:var(--panel); border-left:1px solid var(--line);
    overflow-y:auto; padding:18px;
  }
  #detail::-webkit-scrollbar{width:8px}
  #detail::-webkit-scrollbar-thumb{background:#2a3242;border-radius:4px}
  .empty{color:var(--tx3); font-size:12.5px; line-height:1.8; padding-top:20px}
  .tick{font-size:11px;color:var(--tx3);letter-spacing:.6px}
  .dname{font-size:21px;font-weight:700;margin:2px 0 10px;letter-spacing:-.3px}
  .badge{display:inline-block;font-size:10.5px;padding:3px 8px;border-radius:20px;
    background:var(--panel2);border:1px solid var(--line);color:var(--tx2);margin:0 4px 4px 0}
  .price{display:flex;align-items:baseline;gap:9px;margin:14px 0 4px}
  .price .p{font-size:28px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
  .price .c{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
  .up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--tx2)}
  .asof{font-size:10.5px;color:var(--tx3);margin-bottom:16px}
  .role{font-size:13px;font-weight:600;color:var(--accent);margin:16px 0 6px}
  .desc{font-size:12.5px;line-height:1.75;color:var(--tx2);white-space:pre-wrap}
  h3.rel{font-size:10.5px;letter-spacing:.9px;color:var(--tx3);margin:22px 0 8px;
    text-transform:uppercase}
  .rel-item{display:flex;gap:9px;align-items:flex-start;padding:8px 0;
    border-top:1px solid var(--line);cursor:pointer}
  .rel-item:hover{background:#1a2030;margin:0 -8px;padding:8px;border-radius:6px;border-top-color:transparent}
  .rel-tag{font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:4px;flex:none;margin-top:1px}
  .rel-body{min-width:0}
  .rel-name{font-size:12.5px;font-weight:600}
  .rel-lab{font-size:11.5px;color:var(--tx3);margin-top:1px;line-height:1.5}
  .arrow{color:var(--tx3);font-size:11px}
  .exlink{display:block;margin-top:20px;padding:9px;text-align:center;border-radius:7px;
    border:1px solid var(--line);color:var(--tx2);text-decoration:none;font-size:12px}
  .exlink:hover{color:var(--tx);border-color:var(--tx3)}
  .mine{display:inline-block;font-size:9.5px;padding:2px 6px;border-radius:4px;
    background:#7dd3fc22;color:var(--accent);margin-left:6px;vertical-align:2px}

  /* ── 모달 ── */
  #veil{position:fixed;inset:0;background:#05070bcc;display:none;z-index:50;
    align-items:center;justify-content:center;padding:24px}
  #veil.on{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    width:100%;max-width:520px;max-height:86vh;overflow-y:auto;padding:22px;
    box-shadow:0 24px 70px #000a}
  .modal::-webkit-scrollbar{width:8px}
  .modal::-webkit-scrollbar-thumb{background:#2a3242;border-radius:4px}
  .modal h2{margin:0 0 4px;font-size:17px;letter-spacing:-.2px}
  .modal .sub{margin:0 0 18px;font-size:11.5px;color:var(--tx3);line-height:1.6}
  .f{margin-bottom:13px}
  .f label{display:block;font-size:11px;color:var(--tx3);margin-bottom:5px;letter-spacing:.3px}
  .f .req{color:var(--accent)}
  .f input[type=text], .f textarea, .f select{
    width:100%;padding:8px 10px;border-radius:7px;border:1px solid var(--line);
    background:var(--panel2);color:var(--tx);font-size:13px;outline:none;
    font-family:inherit;
  }
  .f textarea{resize:vertical;min-height:74px;line-height:1.6}
  .f input:focus,.f textarea:focus,.f select:focus{border-color:var(--accent)}
  .f .tip{font-size:10.5px;color:var(--tx3);margin-top:4px;line-height:1.5}
  .row2{display:flex;gap:10px}
  .row2>*{flex:1;min-width:0}
  .sw{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
  .sw i{width:26px;height:26px;border-radius:7px;cursor:pointer;display:block;
    border:2px solid transparent}
  .sw i.on{border-color:var(--tx)}
  .sw input[type=color]{width:34px;height:26px;padding:0;border:1px solid var(--line);
    background:none;border-radius:7px;cursor:pointer}
  .relrow{display:flex;gap:6px;margin-bottom:7px;align-items:center}
  .relrow select{flex:none;width:86px;padding:7px 6px;font-size:12px}
  .relrow select.who{flex:1;width:auto}
  .relrow input{flex:1.2;min-width:0;padding:7px 8px;font-size:12px}
  .relrow .x{flex:none;width:24px;height:24px;border:none;background:none;
    color:var(--tx3);cursor:pointer;font-size:15px}
  .relrow .x:hover{color:var(--up)}
  .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;
    border-top:1px solid var(--line);padding-top:16px}
  .acts button{padding:9px 18px;border-radius:8px;font-size:13px;cursor:pointer;
    font-family:inherit;border:1px solid var(--line);background:transparent;color:var(--tx2)}
  .acts button:hover{color:var(--tx)}
  .acts button.pri{background:var(--accent);border-color:var(--accent);color:#0b1017;font-weight:600}
  .acts button.pri:hover{filter:brightness(1.1);color:#0b1017}
  .err{color:var(--up);font-size:11.5px;margin-top:10px;min-height:16px}
  #toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);
    background:var(--panel2);border:1px solid var(--line);color:var(--tx);
    padding:10px 18px;border-radius:9px;font-size:12.5px;opacity:0;pointer-events:none;
    transition:.25s;z-index:60;box-shadow:0 10px 30px #0008}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-width:860px){ #side{display:none} #detail{width:290px} }
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="brand">
      <h1>StockMap</h1>
      <p>산업 밸류체인 관계도</p>
    </div>
    <div class="sec">
      <h2>검색</h2>
      <input id="q" placeholder="회사명 / 티커 / 키워드" autocomplete="off">
    </div>
    <div class="sec">
      <h2>업종</h2>
      <div id="sectors"></div>
      <button class="btn" id="addSector">＋ 업종 추가</button>
      <button class="btn" id="addCompany">＋ 기업 추가</button>
    </div>
    <div class="sec">
      <h2>관계</h2>
      <div id="ltypes"></div>
    </div>
    <div class="sec" id="mybox" style="display:none">
      <h2>내가 추가한 항목</h2>
      <div id="mystat" style="font-size:12px;color:var(--tx2);line-height:1.7"></div>
      <button class="btn solid" id="exportBtn">data.js로 내보내기</button>
      <button class="btn solid" id="resetBtn">추가 항목 전체 삭제</button>
    </div>
    <div class="foot">
      노드 클릭 → 상세 · 드래그 → 이동<br>
      휠 → 확대 · 배경 드래그 → 화면 이동<br>
      추가한 항목은 이 브라우저에 저장됩니다
    </div>
  </aside>

  <div id="graphwrap">
    <svg id="svg"><g id="scene">
      <g id="glinks"></g><g id="gnodes"></g>
    </g></svg>
    <div class="hint" id="hint"></div>
    <div id="zoombox">
      <button id="zin" title="확대">+</button>
      <button id="zout" title="축소">−</button>
      <button id="zfit" title="맞춤">⤢</button>
    </div>
  </div>

  <aside id="detail"></aside>
</div>

<div id="veil"><div class="modal" id="modal"></div></div>
<div id="toast"></div>

<script src="data.js"></script>
<script>
/* ═══════════════════════════════════════════
   1. 데이터 레이어 (기본 data.js + 사용자 추가분)
   ═══════════════════════════════════════════ */
const LS = 'stockmap.custom.v1';
function loadCustom(){
  try{
    const c = JSON.parse(localStorage.getItem(LS));
    if(c && c.sectors && c.nodes && c.links) return c;
  }catch(e){}
  return { sectors:{}, nodes:[], links:[] };
}
let custom = loadCustom();
function saveCustom(){
  try{ localStorage.setItem(LS, JSON.stringify(custom)); }
  catch(e){ toast('저장 실패 — 브라우저 저장 공간을 확인하세요'); }
  renderMyBox();
}

let SEC, ALLN, ALLL;
function mergeData(){
  SEC  = { ...SECTORS, ...custom.sectors };
  ALLN = [ ...NODES, ...custom.nodes ];
  ALLL = [ ...LINKS,  ...custom.links ];
  // 삭제된 업종을 참조하는 노드는 첫 업종으로 흡수
  const fallback = Object.keys(SEC)[0];
  ALLN.forEach(n=>{ if(!SEC[n.sector]) n.sector = fallback; });
}

/* ═══════════ 2. 그래프 모델 ═══════════ */
let nodes=[], byId={}, links=[];
const pos = {};   // id -> {x,y} 위치 기억 (재구성 시 유지)

function rebuildModel(){
  mergeData();
  nodes = ALLN.map((n,i)=>{
    const p = pos[n.id] || {
      x: 480 + Math.cos(i/ALLN.length*6.283)*260 + (Math.random()-.5)*40,
      y: 380 + Math.sin(i/ALLN.length*6.283)*260 + (Math.random()-.5)*40,
    };
    return { ...n, x:p.x, y:p.y, vx:0, vy:0, r:9, deg:0 };
  });
  byId = Object.fromEntries(nodes.map(n=>[n.id,n]));
  links = ALLL.filter(l=>byId[l.from]&&byId[l.to])
              .map(l=>({...l, s:byId[l.from], t:byId[l.to]}));
  links.forEach(l=>{ l.s.deg++; l.t.deg++; });
  nodes.forEach(n=>n.r = 9 + Math.min(n.deg,14)*1.15);
  // 새로 생긴 업종은 기본 표시
  Object.keys(SEC).forEach(k=>{ if(!seenSectors.has(k)){ seenSectors.add(k); state.sectors.add(k); } });
}
const seenSectors = new Set();

const state = {
  sectors: new Set(),
  types:   new Set(Object.keys(LINK_TYPES)),
  query:   '',
  selected:null,
  hover:   null,
};
const quotes = {};

/* ═══════════ 3. 사이드바 ═══════════ */
const secBox = document.getElementById('sectors');
function renderSectorList(){
  secBox.innerHTML = '';
  Object.entries(SEC).forEach(([k,v])=>{
    const mine = !!custom.sectors[k];
    const used = nodes.filter(n=>n.sector===k).length;
    const el = document.createElement('label');
    el.className = 'chk' + (state.sectors.has(k)?' on':'');
    el.style.color = v.color;
    el.innerHTML = `<span class="dot" style="background:${v.color}"></span>
      <span style="color:inherit">${esc(v.name)}</span>
      <span class="cnt">${used}</span>
      ${mine?'<span class="del" title="업종 삭제">✕</span>':''}`;
    el.onclick = e=>{
      if(e.target.classList.contains('del')){ e.stopPropagation(); delSector(k); return; }
      state.sectors.has(k) ? state.sectors.delete(k) : state.sectors.add(k);
      el.classList.toggle('on', state.sectors.has(k));
      paint();
      return;
    };
    secBox.appendChild(el);
  });
}
const ltBox = document.getElementById('ltypes');
Object.entries(LINK_TYPES).forEach(([k,v])=>{
  const el = document.createElement('label');
  el.className='chk on'; el.style.color=v.color;
  el.innerHTML = `<span class="bar" style="background:${v.color}"></span>
                  <span style="color:inherit">${v.name}</span>`;
  el.onclick = ()=>{
    state.types.has(k) ? state.types.delete(k) : state.types.add(k);
    el.classList.toggle('on', state.types.has(k));
    paint();
    if(state.selected) drawDetail(state.selected);
  };
  ltBox.appendChild(el);
});
document.getElementById('q').oninput = e=>{
  state.query = e.target.value.trim().toLowerCase(); paint();
};

function renderMyBox(){
  const box=document.getElementById('mybox');
  const ns=custom.nodes.length, ss=Object.keys(custom.sectors).length, ls=custom.links.length;
  if(!ns && !ss){ box.style.display='none'; return; }
  box.style.display='';
  document.getElementById('mystat').innerHTML =
    `업종 <b>${ss}</b> · 기업 <b>${ns}</b> · 관계 <b>${ls}</b>`;
}

function nodeVisible(n){ return state.sectors.has(n.sector); }
function matchQ(n){
  if(!state.query) return true;
  const s=(n.name+' '+(n.ticker||'')+' '+n.role+' '+(n.tags||[]).join(' ')+' '+n.desc).toLowerCase();
  return s.includes(state.query);
}
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ═══════════ 4. 힘 시뮬레이션 ═══════════ */
let alpha=1;
function tick(){
  if(alpha < 0.002) return;
  alpha *= 0.985;
  const cx=480, cy=380;
  for(let i=0;i<nodes.length;i++){
    const a=nodes[i];
    for(let j=i+1;j<nodes.length;j++){
      const b=nodes[j];
      let dx=b.x-a.x, dy=b.y-a.y;
      let d2=dx*dx+dy*dy; if(d2<1){dx=Math.random()-.5;dy=Math.random()-.5;d2=1}
      const d=Math.sqrt(d2), min=a.r+b.r+58;
      const f = 9000/d2 + (d<min ? (min-d)*1.1 : 0);
      const ux=dx/d, uy=dy/d;
      a.vx-=ux*f*0.01; a.vy-=uy*f*0.01;
      b.vx+=ux*f*0.01; b.vy+=uy*f*0.01;
    }
  }
  for(const l of links){
    const dx=l.t.x-l.s.x, dy=l.t.y-l.s.y;
    const d=Math.max(Math.sqrt(dx*dx+dy*dy),1);
    const f=(d-200)*0.012, ux=dx/d, uy=dy/d;
    l.s.vx+=ux*f; l.s.vy+=uy*f;
    l.t.vx-=ux*f; l.t.vy-=uy*f;
  }
  for(const n of nodes){
    if(n.fixed) continue;
    n.vx += (cx-n.x)*0.0022; n.vy += (cy-n.y)*0.0022;
    n.vx*=0.86; n.vy*=0.86;
    n.x+=n.vx; n.y+=n.vy;
    pos[n.id]={x:n.x,y:n.y};
  }
  positionOnly();
}

/* ═══════════ 5. 렌더 ═══════════ */
const svg=document.getElementById('svg'), scene=document.getElementById('scene'),
      GL=document.getElementById('glinks'), GN=document.getElementById('gnodes');
const NS='http://www.w3.org/2000/svg';
let lineEls=new Map(), nodeEls=new Map();

function build(){
  GL.innerHTML=''; GN.innerHTML='';
  lineEls=new Map(); nodeEls=new Map();
  links.forEach(l=>{
    const p=document.createElementNS(NS,'line');
    p.setAttribute('class','link');
    p.setAttribute('stroke',LINK_TYPES[l.type].color);
    if(LINK_TYPES[l.type].dash) p.setAttribute('stroke-dasharray',LINK_TYPES[l.type].dash);
    GL.appendChild(p); lineEls.set(l,p);
  });
  nodes.forEach(n=>{
    const g=document.createElementNS(NS,'g'); g.setAttribute('class','node');
    const c=document.createElementNS(NS,'circle');
    c.setAttribute('r',n.r);
    c.setAttribute('fill',SEC[n.sector].color+'22');
    c.setAttribute('stroke',SEC[n.sector].color);
    c.setAttribute('stroke-width',1.8);
    const t=document.createElementNS(NS,'text');
    t.setAttribute('y',n.r+14); t.textContent=n.name;
    const ch=document.createElementNS(NS,'text');
    ch.setAttribute('class','chg'); ch.setAttribute('y',n.r+26);
    g.append(c,t,ch); GN.appendChild(g);
    nodeEls.set(n,{g,c,t,ch});
    g.onclick = e=>{ e.stopPropagation(); select(n); };
    g.onmouseenter = ()=>{ state.hover=n; paint(); };
    g.onmouseleave = ()=>{ state.hover=null; paint(); };
    g.onmousedown = e=>{ e.stopPropagation(); dragN=n; n.fixed=true; };
  });
}
function positionOnly(){
  for(const [l,p] of lineEls){
    p.setAttribute('x1',l.s.x); p.setAttribute('y1',l.s.y);
    p.setAttribute('x2',l.t.x); p.setAttribute('y2',l.t.y);
  }
  for(const [n,e] of nodeEls) e.g.setAttribute('transform',`translate(${n.x},${n.y})`);
}
function paint(){
  const focus = state.hover || state.selected;
  const near = new Set();
  if(focus){
    near.add(focus.id);
    links.forEach(l=>{
      if(!state.types.has(l.type)) return;
      if(l.s===focus) near.add(l.t.id);
      if(l.t===focus) near.add(l.s.id);
    });
  }
  for(const [n,e] of nodeEls){
    const vis = nodeVisible(n);
    e.g.style.display = vis ? '' : 'none';
    if(!vis) continue;
    const hot = focus ? near.has(n.id) : matchQ(n);
    const dim = focus ? !near.has(n.id) : !matchQ(n);
    e.g.classList.toggle('hot', hot && !!(focus||state.query));
    e.g.classList.toggle('dim', dim);
    e.c.setAttribute('fill', SEC[n.sector].color + (n===focus?'66':'22'));
    e.c.setAttribute('r', n===focus ? n.r+3 : n.r);
    const q = n.ticker && quotes[n.ticker];
    if(q){
      e.ch.textContent = (q.pct>=0?'+':'') + q.pct.toFixed(2) + '%';
      e.ch.setAttribute('fill', q.pct>0?'#f6465d':q.pct<0?'#2ebd85':'#8b97a8');
    } else e.ch.textContent='';
  }
  for(const [l,p] of lineEls){
    const vis = state.types.has(l.type) && nodeVisible(l.s) && nodeVisible(l.t);
    p.style.display = vis ? '' : 'none';
    if(!vis) continue;
    const on = focus && (l.s===focus || l.t===focus);
    p.classList.toggle('hot', !!on);
    p.classList.toggle('dim', !!focus && !on);
  }
}

/* 전체 재구성 (업종/기업 추가·삭제 후) */
function rebuildAll(keep){
  const selId = keep && state.selected ? state.selected.id : null;
  rebuildModel(); build();
  state.selected = selId ? byId[selId] : null;
  state.hover = null;
  alpha = Math.max(alpha, .5);

  drawDetail(state.selected);
  document.getElementById('hint').textContent = `${nodes.length}개 기업 · ${links.length}개 관계`;
  renderMyBox();
}

/* ═══════════ 7. 시세 ═══════════
   1순위: quotes.json (GitHub Actions가 서버에서 받아 커밋한 스냅샷)
   2순위: Yahoo 직접 호출 — 로컬(file://)에서만 동작. 웹 배포 시엔 CORS로 막힘.
   ══════════════════════════════ */
let snapAt = 0;
async function loadSnapshot(){
  try{
    const r = await fetch('quotes.json', {cache:'no-store'});
    if(!r.ok) throw 0;
    const j = await r.json();
    snapAt = j.generatedAt || 0;
    for(const [t,q] of Object.entries(j.quotes||{})){
      quotes[t] = { ...q, time: new Date(q.ts).toLocaleString('ko-KR',
        {month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}) };
    }
  }catch(e){ /* 스냅샷 없음 → 직접 호출로 폴백 */ }
}

async function loadQuote(n){
  if(!n || !n.ticker) return;
  if(quotes[n.ticker] !== undefined){ if(state.selected===n) drawDetail(n); return; }
  try{
    const r = await fetch(`https://query1.finance.yahoo.com/v8/finance/chart/${
      encodeURIComponent(n.ticker)}?range=1d&interval=1d`);
    const m = (await r.json()).chart.result[0].meta;
    const p = m.regularMarketPrice, prev = m.chartPreviousClose ?? m.previousClose;
    if(!isFinite(p) || !isFinite(prev)) throw 0;
    quotes[n.ticker] = { price:p, chg:p-prev, pct:(p-prev)/prev*100,
      cur: m.currency||'USD',
      time: new Date((m.regularMarketTime||Date.now()/1000)*1000)
        .toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}) };
  }catch(e){ quotes[n.ticker]=null; }
  if(state.selected===n) drawDetail(n);
  paint();
}
async function loadAllQuotes(){
  const ts = nodes.filter(n=>n.ticker && quotes[n.ticker]===undefined);
  for(let i=0;i<ts.length;i+=5) await Promise.all(ts.slice(i,i+5).map(loadQuote));
}

/* ═══════════ 9. 팬 / 줌 / 드래그 ═══════════ */
let view={x:0,y:0,k:1};
function applyView(){ scene.setAttribute('transform',`translate(${view.x},${view.y}) scale(${view.k})`); }
svg.addEventListener('wheel',e=>{
  e.preventDefault();
  const r=svg.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
  const k2=Math.min(2.6,Math.max(.28, view.k*(e.deltaY<0?1.12:1/1.12)));
  view.x = mx-(mx-view.x)*(k2/view.k);
  view.y = my-(my-view.y)*(k2/view.k);
  view.k = k2; applyView();
},{passive:false});

let pan=null, dragN=null;
svg.addEventListener('mousedown',e=>{
  if(dragN) return;
  pan={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y}; svg.classList.add('drag');
});
window.addEventListener('mousemove',e=>{
  if(dragN){
    const r=svg.getBoundingClientRect();
    dragN.x=(e.clientX-r.left-view.x)/view.k;
    dragN.y=(e.clientY-r.top -view.y)/view.k;
    dragN.vx=dragN.vy=0; pos[dragN.id]={x:dragN.x,y:dragN.y};
    alpha=Math.max(alpha,.35); positionOnly();
  } else if(pan){
    view.x=pan.vx+(e.clientX-pan.x); view.y=pan.vy+(e.clientY-pan.y); applyView();
  }
});
window.addEventListener('mouseup',()=>{
  if(dragN){ dragN.fixed=false; dragN=null; }
  pan=null; svg.classList.remove('drag');
});

document.getElementById('zin').onclick =()=>{view.k=Math.min(2.6,view.k*1.25);applyView()};
document.getElementById('zout').onclick=()=>{view.k=Math.max(.28,view.k/1.25);applyView()};
document.getElementById('zfit').onclick=fit;
function fit(){
  const xs=nodes.filter(nodeVisible), r=svg.getBoundingClientRect();
  if(!xs.length) return;
  if(r.width<10||r.height<10){ setTimeout(fit,120); return; }
  const x1=Math.min(...xs.map(n=>n.x))-70, x2=Math.max(...xs.map(n=>n.x))+70;
  const y1=Math.min(...xs.map(n=>n.y))-70, y2=Math.max(...xs.map(n=>n.y))+70;
  const k=Math.max(.28, Math.min(r.width/(x2-x1), r.height/(y2-y1), 1.6));
  view.k=k; view.x=r.width/2-(x1+x2)/2*k; view.y=r.height/2-(y1+y2)/2*k;
  applyView();
}

/* ═══════════ 10. 시작 ═══════════ */
rebuildModel(); build();
document.getElementById('hint').textContent = `${nodes.length}개 기업 · ${links.length}개 관계`;
for(let i=0;i<420;i++) tick();
(function loop(){ tick(); requestAnimationFrame(loop); })();
paint(); positionOnly(); renderSectorList(); drawDetail(null); renderMyBox();
setTimeout(fit,60);
loadSnapshot().then(()=>{ paint(); if(state.selected) drawDetail(state.selected); return loadAllQuotes(); });
</script>
